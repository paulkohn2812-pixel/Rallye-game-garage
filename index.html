import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id);const scene=new THREE.Scene();scene.background=new THREE.Color(0x91b9ce);scene.fog=new THREE.FogExp2(0x91b9ce,.0045);const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,1100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);

const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const grass=mat(0x5c8b54),roadMat=mat(0x9c8265),edgeMat=mat(0xe2d3b2),trunk=mat(0x604634),leaf=mat(0x2f6647),leaf2=mat(0x3f8053),rock=mat(0x88918b),yellow=mat(0xf3bc36,.55),dark=mat(0x1a2731),glass=mat(0x557f99,.25),red=mat(0xd73e31),white=mat(0xe8e9dc);

function roadX(z){return 24*Math.sin(z/115)+12*Math.sin(z/49)}function roadDx(z){return 24/115*Math.cos(z/115)+12/49*Math.cos(z/49)}
const len=4400,step=8,half=8.5;const verts=[],uv=[],indices=[];for(let i=0;i<=len/step;i++){let z=-i*step,x=roadX(z);for(const offset of [-half,half]){verts.push(x+offset,.09,z);uv.push(offset, i*step/12)}if(i){let a=(i-1)*2,b=i*2;indices.push(a,a+1,b,a+1,b+1,b)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(indices);geo.computeVertexNormals();let road=new THREE.Mesh(geo,roadMat);road.receiveShadow=true;scene.add(road);

const keys={left:false,right:false,gas:false,brake:false,drift:false};document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const set=v=>{keys[k]=v;b.classList.toggle('down',v)};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>set(false))});const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',' ':'drift'};window.addEventListener('keydown',e=>{if(map[e.key]){e.preventDefault();keys[map[e.key]]=true}});window.addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=false});
let running=false,speed=0,heading=Math.PI,px=roadX(0),pz=0,elapsed=0,dist=0,last=performance.now();car.position.set(px,.12,pz);$('loading').textContent='3D-Engine bereit';$('play').disabled=false;$('play').onclick=()=>{$('start').style.display='none';running=true;last=performance.now()};function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;if(running){elapsed+=dt;let off=Math.abs(px-roadX(pz))>half-1;let max=off?24:49;speed+=((keys.gas?22:0)-(keys.brake?34:0)-5.3-speed*.055)*dt;speed=Math.max(-6,Math.min(max,speed));let steer=(Number(keys.left)-Number(keys.right));heading+=steer*(keys.drift?1.75:1.08)*dt*Math.min(1,Math.abs(speed)/12);let driftFactor=keys.drift?.6:.15;let travelHeading=heading+steer*driftFactor;px+=Math.sin(travelHeading)*speed*dt;pz+=Math.cos(travelHeading)*speed*dt;dist=Math.max(dist,-pz);if(off)speed*=1-.65*dt;car.position.set(px,.15+Math.sin(now*.024)*.025,pz);car.rotation.y=heading-Math.PI;car.rotation.z=steer*Math.min(.09,Math.abs(speed)*.002);$('speed').textContent=Math.round(Math.abs(speed)*3.6)+' km/h';$('distance').textContent=Math.floor(dist)+' / '+len+' m';$('timer').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');$('surface').textContent=off?'GRAS • WENIG GRIP':'SCHOTTER';if(dist>=len-20){running=false;$('start').style.display='flex';$('panel').querySelector('h1').textContent='ZIEL ERREICHT!';$('loading').textContent='Zeit: '+$('timer').textContent;$('play').textContent='NOCHMAL FAHREN';$('play').onclick=()=>location.reload()}}const behind=new THREE.Vector3(-Math.sin(heading)*10,5.6,-Math.cos(heading)*10);const desired=car.position.clone().add(behind);camera.position.lerp(desired,Math.min(1,dt*4.3));const target=car.position.clone().add(new THREE.Vector3(Math.sin(heading)*9,1.7,Math.cos(heading)*9));camera.lookAt(target);sun.position.set(px-80,150,pz+110);sun.target.position.set(px,0,pz);sun.target.updateMatrixWorld();renderer.re
