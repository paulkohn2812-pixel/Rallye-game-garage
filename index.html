function buyCar(i){if(save.owned.includes(i)){car=i}else if(save.cash>=cars[i].price){save.cash-=cars[i].price;save.owned.push(i);car=i}persist();garage()}
function upgrade(i){let cost=(save.upgrades[i]+1)*500;if(save.cash>=cost&&save.upgrades[i]<3){save.cash-=cost;save.upgrades[i]++;persist()}garage()}

const keys={left:false,right:false,gas:false,brake:false,drift:false};document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;function set(v,e){e.preventDefault();keys[k]=v;b.classList.toggle('active',v);if(v&&b.setPointerCapture)try{b.setPointerCapture(e.pointerId)}catch(_){} }b.addEventListener('pointerdown',e=>set(true,e));for(let type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,e=>set(false,e))});const keymap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',' ':'drift',a:'left',d:'right',w:'gas',s:'brake'};addEventListener('keydown',e=>{if(keymap[e.key]){keys[keymap[e.key]]=true;e.preventDefault()}if(e.key==='Escape')pause()});addEventListener('keyup',e=>{if(keymap[e.key])keys[keymap[e.key]]=false});
const palettes={forest:{sky:['#6eabc2','#d3e5d9'],far:'#6b8f8e',mount:'#3e6869',ground:'#47764f',grass:'#528456',road:'#9c866e',edge:'#e5d8b4',tree:'#20533a'},alpine:{sky:['#639bc7','#c7d9e7'],far:'#a4bcc2',mount:'#718e9a',ground:'#608b63',grass:'#659869',road:'#888d91',edge:'#e9e8d4',tree:'#2d6153'},desert:{sky:['#568db2','#f8cf9b'],far:'#c68f6b',mount:'#ac7054',ground:'#bb8d59',grass:'#c39965',road:'#b69a72',edge:'#e4c39d',tree:'#4e7d52'},snow:{sky:['#526f92','#d5e5ee'],far:'#b6c7d3',mount:'#8aa1b6',ground:'#e0e7e7',grass:'#e9eded',road:'#8b9da6',edge:'#f9ffff',tree:'#28565a'},autumn:{sky:['#789ac1','#f5cba1'],far:'#9e8d87',mount:'#766e74',ground:'#887c55',grass:'#998c60',road:'#9c8674',edge:'#e8d7b3',tree:'#b46b35'}};
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}
function sky(p,t){let h=H*.53;let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,p.sky[0]);g.addColorStop(1,p.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff8';ctx.beginPath();ctx.arc(W*.79,h*.27,Math.max(17,W*.045),0,Math.PI*2);ctx.fill();for(let layer=0;layer<2;layer++){let y=h*(layer?.89:.76),amp=h*(layer?.30:.24);ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=W+8;x+=8){let v=Math.sin(x/W*12+layer*2.2+Math.sin(x/W*3)*1.6)*.45+Math.sin(x/W*25+layer*1.3)*.19;ctx.lineTo(x,y-v*amp)}ctx.lineTo(W,h);ctx.closePath();ctx.fillStyle=layer?p.mount:p.far;ctx.fill()}ctx.fillStyle=p.ground;ctx.fillRect(0,h,W,H-h)}
function tree(x,y,s,p,kind){if(s<1.5)return;ctx.save();ctx.translate(x,y);if(kind==='desert'){ctx.fillStyle='#46765d';ctx.fillRect(-s*.12,-s*.9,s*.24,s*.9);ctx.fillRect(-s*.4,-s*.6,s*.7,s*.15);ctx.fillRect(-s*.4,-s*.8,s*.15,s*.4);ctx.fillRect(s*.25,-s*.75,s*.15,s*.32)}else{ctx.fillStyle='#4b3428';ctx.fillRect(-s*.085,-s*.44,s*.17,s*.46);let col=kind==='autumn'?['#ba7538','#c34f34','#e1a44c']:kind==='snow'?['#2c5555','#4a7773']: [p.tree,'#31684b','#3c7650'];for(let j=0;j<3;j++){ctx.fillStyle=col[j%col.length];poly([[-s*(.5-j*.09),-s*(.27+j*.24)],[0,-s*(1.4-j*.21)],[s*(.5-j*.09),-s*(.27+j*.24)]],ctx.fillStyle)}}ctx.restore()}

function render(){let p=palettes[stages[stage].theme],t=run?.distance||0;sky(p,t);if(!run)return;let horizon=H*.53,segments=100,camX=run.x,curv=0,prev=null;for(let i=segments;i>=1;i--){let depth=i/segments,dist=(1-depth)*840+15,idx=clamp(Math.floor((t+dist)/12),0,road.length-1);let z=road[idx],near=1/(.15+dist/235),width=W*.46*near,yy=horizon+(H-horizon)*Math.pow(1-depth,.69),bend=0;for(let q=0;q<4;q++)bend+=curveAt(t+dist*(q+1)/4);let center=W*.5+ (bend*.24-camX*.55)*W*near*.23;let left=center-width,right=center+width;if(prev){let grass=i%2?p.grass:p.ground;poly([[0,yy],[W,yy],[W,prev.y],[0,prev.y]],grass);poly([[left-width*.075,yy],[right+width*.075,yy],[prev.right+prev.width*.075,prev.y],[prev.left-prev.width*.075,prev.y]],p.edge);poly([[left,yy],[right,yy],[prev.right,prev.y],[prev.left,prev.y]],i%2?p.road:shade(p.road,-7));if(i%6<3){let lineW=Math.max(1,width*.025);poly([[center-lineW,yy],[center+lineW,yy],[prev.center+lineW,prev.y],[prev.center-lineW,prev.y]],'#e8e0cb')}}let s=Math.min(145,(H-horizon)*.23*near);if(i%4===0&&s>2){let side=(z.side>.5?1:-1),xx=center+side*(width*1.4+Math.abs(z.tree-.5)*width*.9);tree(xx,yy,s,p,stages[stage].theme);if(z.object>.73)tree(center-side*(width*1.65),yy,s*.76,p,stages[stage].theme)}prev={y:yy,left,right,width,center}}

function shade(hex,delta){let v=parseInt(hex.slice(1),16),r=clamp((v>>16)+delta,0,255),g=clamp(((v>>8)&255)+delta,0,255),b=clamp((v&255)+delta,0,255);return `rgb(${r},${g},${b})`}
function update(dt){if(mode!=='race')return;dt=Math.min(dt,.05);let s=stages[stage],c=cars[car];let max=172*c.power*(1+save.upgrades[0]*.075);let accel=keys.gas?56*c.power:-25;if(keys.brake)accel-=115;if(run.health<40)accel*=.68;run.speed=clamp(run.speed+accel*dt,0,max);let steer=(Number(keys.right)-Number(keys.left));let grip=c.grip*(1+save.upgrades[1]*.09);let turn=steer*(.78+run.speed/150)*dt*(keys.drift?1.8:1)*grip;run.vx=mix(run.vx,turn/dt,Math.min(1,dt*(keys.drift?2.5:6)));let bend=curveAt(run.distance+75);run.x+=(run.vx*.88-bend*run.speed/220)*dt*2.2;run.distance+=run.speed/3.6*dt;run.time+=dt;run.shake=Math.max(0,run.shake-dt*2.8);if(Math.abs(run.x)>1.65){run.speed=Math.max(18,run.speed-85*dt);if(run.speed>38){run.health=Math.max(0,run.health-7*dt);run.shake=.35}}if(Math.abs(run.x)>2.55){run.x=Math.sign(run.x)*2.55;run.health=Math.max(0,run.health-14*dt);run.speed*=.985;run.shake=.8}if(run.health<=0){finish(false,'TOTALSCHADEN');return}if(run.distance>=s.len){finish(run.time<=s.goal,'ZIEL ERREICHT');return}let checkpoint=Math.floor(run.distance/500);if(checkpoint>run.checkpoint){run.checkpoint=checkpoint;flash(`${checkpoint*500} METER`)}$('speed').textContent=Math.round(run.speed);$('damage').textContent=`FAHRZEUG ${Math.ceil(run.health)}%`;$('clock').textContent=`${String(Math.floor(run.time/60)).padStart(2,'0')}:${String(Math.floor(run.time%60)).padStart(2,'0')}.${Math.floor(run.time*10)%10}`;$('meters').textContent=Math.floor(run.distance);$('bar').style.width=`${clamp(run.distance/s.len*100,0,100)}%`}
function finish(won,reason){let s=stages[stage];mode='result';let first=won&&!save.wins.includes(stage),reward=won?s.award:Math.round(s.award*.2);save.cash+=reward;if(won){if(first)save.wins.push(stage);save.unlocked=Math.max(save.unlocked,Math.min(stages.length-1,stage+1))}persist();show(`<div class="eyebrow">${reason}</div><h1 class="logo">${won?'🏆 SIEG!':'ETAPPE'}<br><em>${won?'BESTANDEN':'VERLOREN'}</em></h1><div class="card"><div class="row"><span>Deine Zeit</span><strong>${run.time.toFixed(1)} s</strong></div><div class="row"><span>Rivalenzeit</span><strong>${s.goal} s</strong></div><div class="row"><span>Fahrzeugzustand</span><strong>${Math.round(run.health)}%</strong></div><div class="row"><span>Preisgeld</span><strong>+${reward} CR</strong></div></div><p class="sub">${won?'Du hast bewiesen, dass du hierhergehörst. Die nächste Herausforderung wartet.':'Trainiere die Kurven, verbessere deinen Wagen und versuche es erneut.'}</p><div class="actions"><button class="btn" onclick="${won?'choose()':`start(${stage})`}">${won?'WEITER':'NOCHMAL'}</button><button class="btn alt" onclick="garage()">GARAGE</button><button class="btn alt" onclick="home()">MENÜ</button></div>`)}
function loop(ms){let dt=last?(ms-last)/1000:0;last=ms;frame++;if(mode==='race'){update(dt);render()}else if(mode==='pause'){render()}else{let p=palettes.forest;sky(p,0);ctx.fillStyle='#10233199';ctx.fillRect(0,0,W,H)}requestAnimationFrame(loop)}home();requestAnimationFrame(loop);
</script></body></html>
