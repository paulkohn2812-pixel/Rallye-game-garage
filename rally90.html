<script type="module">

const loader=new THREE.TextureLoader();

let seed=1223;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
const roadLength=3400,step=5,roadHalf=4.5;
function path(s){return {x:32*Math.sin(s*.0038)+18*Math.sin(s*.0081)+7*Math.sin(s*.016),z:-s,y:4.8*Math.sin(s*.004)+2.6*Math.sin(s*.011)+.00045*s}}

function direction(s){const a=path(s-1),b=path(s+1);return new THREE.Vector3(b.x-a.x,b.y-a.y,b.z-a.z).normalize()}

function makeStrip(width,material,yOff=0){const vertices=[],uv=[],index=[];for(let s=0;s<=roadLength;s+=step){const p=path(s),n=normal(s);for(let side of [-1,1]){vertices.push(p.x+n.x*width*side,p.y+yOff,p.z+n.z*width*side);uv.push(side===-1?0:1,s/16)}}const count=roadLength/step+1;for(let i=0;i<count-1;i++){const k=i*2;index.push(k,k+1,k+2,k+1,k+3,k+2)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(index);g.computeVertexNormals();const m=new THREE.Mesh(g,material);m.receiveShadow=true;scene.add(m);return m}
const terrainV=[],terrainUV=[],terrainIdx=[];const cols=81,rows=341;
for(let j=0;j<rows;j++){let s=j*10;const p=path(s);for(let i=0;i<cols;i++){const off=(i/(cols-1)-.5)*340;const x=p.x+off;const z=p.z;terrainV.push(x,height(x,z)-.28,z);terrainUV.push(x/12,z/12)}}
for(let j=0;j<rows-1;j++)for(let i=0;i<cols-1;i++){const a=j*cols+i,b=a+cols;terrainIdx.push(a,b,a+1,a+1,b,b+1)}
const tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.Float32BufferAttribute(terrainV,3));tg.setAttribute('uv',new THREE.Float32BufferAttribute(terrainUV,2));tg.setIndex(terrainIdx);tg.computeVertexNormals();

makeStrip(roadHalf+1.3,soil,.03);makeStrip(roadHalf,gravel,.075);
const lineMat=new THREE.MeshStandardMaterial({color:0x6c5b4b,roughness:1});
for(let side of [-1,1]){const v=[],ix=[];for(let s=0;s<=roadLength;s+=step){const p=path(s),n=normal(s);for(const d of [2.2,2.29])v.push(p.x+n.x*d*side,p.y+.089,p.z+n.z*d*side)}for(let i=0;i<roadLength/step;i++){const a=i*2;ix.push(a,a+1,a+2,a+1,a+3,a+2)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(ix);g.computeVertexNormals();const m=new THREE.Mesh(g,lineMat);m.receiveShadow=true;scene.add(m)}
// Real 3D forest: varied layered branch clusters, irregular trunk geometry, instanced for mobile performance.
const trunkMat=new THREE.MeshStandardMaterial({color:0x514a37,roughness:1});
const needleMats=[0x20352b,0x31412f,0x4d5133,0x5d5137].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:false}));
const pineGeos=[];
for(let k=0;k<3;k++){
 const geo=new THREE.ConeGeometry(1,2.7,9,6);
 const a=geo.attributes.position;
 for(let i=0;i<a.count;i++){const x=a.getX(i),y=a.getY(i),z=a.getZ(i);const theta=Math.atan2(z,x);const f=1+.16*Math.sin(theta*7+y*11+k)+.08*Math.cos(theta*13-y*9);a.setXYZ(i,x*f,y+.06*Math.sin(theta*9+y*8),z*f)}

}
const count=4300,forest=[],dummy=new THREE.Object3D();
for(let k=0;k<3;k++){const foliage=new THREE.InstancedMesh(pineGeos[k],needleMats[k%needleMats.length],count);foliage.castShadow=k===0;foliage.receiveShadow=true;foliage.frustumCulled=false;scene.add(foliage);forest.push(foliage)}
const trunks=new THREE.InstancedMesh(new THREE.CylinderGeometry(.13,.22,1,7),trunkMat,count);trunks.castShadow=true;trunks.frustumCulled=false;scene.add(trunks);
for(let i=0;i<count;i++){const s=rnd()*roadLength,p=path(s),side=rnd()<.5?-1:1,d=roadHalf+6+rnd()*155;const x=p.x+d*side,z=p.z+(rnd()-.5)*12,y=height(x,z);const tall=6+rnd()*13,wide=1.2+rnd()*1.6;const rot=rnd()*Math.PI*2;
 for(let k=0;k<3;k++){dummy.position.set(x,y+1.8+k*tall*.19,z);dummy.rotation.set(0,rot,0);dummy.scale.set(wide*(1-k*.21),tall*.46,wide*(1-k*.21));dummy.updateMatrix();forest[k].setMatrixAt(i,dummy.matrix)}
 dummy.position.set(x,y+tall*.32,z);dummy.rotation.set(0,rot,0);dummy.scale.set(1,tall*.64,1);dummy.updateMatrix();trunks.setMatrixAt(i,dummy.matrix)
}
forest.forEach(m=>m.instanceMatrix.needsUpdate=true);trunks.instanceMatrix.needsUpdate=true;
// Additional deciduous trees with autumn foliage and nonuniform multi-lobed crowns.
const leafColors=[0x7d4a2c,0x9b6436,0x6f6338,0x5d693f,0xb17b3c,0x745a32];
const deciduous=new THREE.Group();scene.add(deciduous);
const crownGeo=new THREE.IcosahedronGeometry(1,2);
const branchGeo=new THREE.CylinderGeometry(.12,.22,1,6);
const leafMeshes=leafColors.map(c=>{const m=new THREE.InstancedMesh(crownGeo,new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:false}),420);m.castShadow=true;m.receiveShadow=true;m.frustumCulled=false;deciduous.add(m);return m});
const branches=new THREE.InstancedMesh(branchGeo,trunkMat,420);branches.castShadow=true;branches.frustumCulled=false;deciduous.add(branches);
const crownCounts=leafColors.map(()=>0);
for(let i=0;i<420;i++){
 const s=rnd()*roadLength,p=path(s),side=rnd()<.5?-1:1,dist=roadHalf+9+rnd()*100;
 const x=p.x+side*dist,z=p.z+(rnd()-.5)*8,y=height(x,z),h=7+rnd()*10;
 dummy.position.set(x,y+h*.52,z);dummy.rotation.set(0,rnd()*6,0);dummy.scale.set(1,h*.92,1);dummy.updateMatrix();branches.setMatrixAt(i,dummy.matrix);
 const c=Math.floor(rnd()*leafMeshes.length),n=crownCounts[c]++;
 if(n<420){dummy.position.set(x,y+h*.91,z);dummy.rotation.set(rnd(),rnd()*6,rnd());dummy.scale.set(2.1+rnd()*1.8,2.8+rnd()*2.2,2+rnd()*1.8);dummy.updateMatrix();leafMeshes[c].setMatrixAt(n,dummy.matrix)}
}
leafMeshes.forEach((m,i)=>{m.count=crownCounts[i];m.instanceMatrix.needsUpdate=true});branches.instanceMatrix.needsUpdate=true;
// Roadside undergrowth: grass clumps and low shrubs.
const shrubGeo=new THREE.IcosahedronGeometry(1,1),shrubMat=new THREE.MeshStandardMaterial({color:0x48533a,roughness:1});
const shrubs=new THREE.InstancedMesh(shrubGeo,shrubMat,1800);shrubs.frustumCulled=false;scene.add(shrubs);
for(let i=0;i<1800;i++){const s=rnd()*roadLength,p=path(s),side=rnd()<.5?-1:1,dist=roadHalf+1.5+rnd()*42;const x=p.x+side*dist,z=p.z+(rnd()-.5)*4,y=height(x,z);dummy.position.set(x,y+.28,z);dummy.rotation.set(0,rnd()*6,0);dummy.scale.set(.25+rnd()*.55,.22+rnd()*.35,.3+rnd()*.55);dummy.updateMatrix();shrubs.setMatrixAt(i,dummy.matrix)}shrubs.instanceMatrix.needsUpdate=true;
// Steel guardrail sections on outer edges of selected bends.
const guardMetal=new THREE.MeshStandardMaterial({color:0x8d8e88,metalness:.73,roughness:.38});
const railGeo=new THREE.BoxGeometry(.12,.26,3.8);
const postG=new THREE.BoxGeometry(.12,.75,.12);
const guardGroup=new THREE.Group();scene.add(guardGroup);
for(let s=160;s<roadLength-200;s+=8){
 if(!(s%470<170))continue;
 const p=path(s),n=normal(s),d=direction(s),side=(Math.floor(s/470)%2)?1:-1;
 const x=p.x+n.x*side*6.8,z=p.z+n.z*side*6.8;
 const beam=new THREE.Mesh(railGeo,guardMetal);beam.position.set(x,p.y+.72,z);beam.rotation.y=Math.atan2(d.x,d.z);beam.castShadow=true;guardGroup.add(beam);
 if(s%16<8){const post=new THREE.Mesh(postG,guardMetal);post.position.set(x,p.y+.38,z);post.castShadow=true;guardGroup.add(post)}
}
// Real irregular rocks, roadside bushes, and marker posts.
const rockGeo=new THREE.IcosahedronGeometry(1,1),rockCount=420,rocks=new THREE.InstancedMesh(rockGeo,rockMat,rockCount);rocks.castShadow=true;rocks.receiveShadow=true;rocks.frustumCulled=false;scene.add(rocks);
for(let i=0;i<rockCount;i++){const s=rnd()*roadLength,p=path(s),d=(roadHalf+4+rnd()*120)*(rnd()<.5?-1:1),x=p.x+d,z=p.z+(rnd()-.5)*14;dummy.position.set(x,height(x,z)+.2,z);dummy.rotation.set(rnd()*2,rnd()*6,rnd()*2);const r=.35+rnd()*2.1;dummy.scale.set(r*1.3,r*.55,r);dummy.updateMatrix();rocks.setMatrixAt(i,dummy.matrix)}rocks.instanceMatrix.needsUpdate=true;
const postGeo=new THREE.BoxGeometry(.13,.8,.12),postMat=new THREE.MeshStandardMaterial({color:0xded9c9}),posts=new THREE.InstancedMesh(postGeo,postMat,300);posts.castShadow=true;posts.frustumCulled=false;scene.add(posts);
for(let i=0;i<300;i++){const s=(i>>1)*22+15,p=path(s),n=normal(s),side=i%2?1:-1;dummy.position.set(p.x+n.x*side*7,p.y+.4,p.z+n.z*side*7);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);dummy.updateMatrix();posts.setMatrixAt(i,dummy.matrix)}posts.instanceMatrix.needsUpdate=true;
const red=new THREE.MeshStandardMaterial({color:0xd45b41}),caps=new THREE.InstancedMesh(new THREE.BoxGeometry(.15,.14,.15),red,300);scene.add(caps);
for(let i=0;i<300;i++){posts.getMatrixAt(i,dummy.matrix);dummy.matrix.decompose(dummy.position,dummy.quaternion,dummy.scale);dummy.position.y+=.36;dummy.updateMatrix();caps.setMatrixAt(i,dummy.matrix)}caps.instanceMatrix.needsUpdate=true;
// Load actual separate GLB, not a procedural substitute masquerading as a model.
let car=new THREE.Group(),modelLoaded=false;scene.add(car);
const gltf=new GLTFLoader();
function loadCar(){return new Promise((resolve,reject)=>gltf.load('assets/audi_rally.glb',g=>{const model=g.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.side=THREE.FrontSide}}});model.rotation.y=Math.PI;car.add(model);modelLoaded=true;resolve()},undefined,reject))}
let pos=80,lateral=0,speed=0,heading=0,camMode=0,qualityHigh=true,prev=performance.now();

for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;const on=e=>{e.preventDefault();input[k]=true;b.classList.add('held');b.setPointerCapture(e.pointerId)};const off=e=>{e.preventDefault();input[k]=false;b.classList.remove('held')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)}
const keys={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',a:'left',d:'right',w:'gas',s:'brake'};

function frame(now){requestAnimationFrame(frame);const dt=Math.min(.045,(now-prev)/1000||.016);prev=now;
 const acc=input.gas?7.8:0,brake=input.brake?16:0;
 speed=Math.max(0,Math.min(42,speed+(acc-brake-1.15-speed*.013)*dt));
 const steer=(input.right?1:0)-(input.left?1:0);

 const angle=Math.atan2(d.x,-d.z);car.rotation.set(-Math.atan2(d.y,Math.hypot(d.x,d.z))*.4,angle+Math.PI+steer*.06,steer*-.025);

}
