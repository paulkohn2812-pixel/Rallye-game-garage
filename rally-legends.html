<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101722"><title>Rally Legends</title><style>*{box-sizing:border-box}body{margin:0;background:#101722;color:white;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:0;left:0;right:0;padding:12px 14px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 5px #000;font-weight:800}#controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}.cluster{display:flex;gap:10px}.ctl{pointer-events:auto;border:1px solid #ffffff55;border-radius:18px;background:#ffffff25;color:white;font-size:25px;font-weight:900;width:75px;height:75px;touch-action:none;backdrop-filter:blur(5px)}.ctl:active{background:#e8ae38aa}#menu{position:fixed;inset:0;background:linear-gradient(140deg,#101925ee,#1b3445f5);overflow-y:auto;padding:22px 18px 110px}h1{font-size:35px;letter-spacing:2px;margin:12px 0 4px;color:#ffcb5b}h2{margin:16px 0 8px}.sub{color:#b7c6d2}.panel{background:#ffffff0d;border:1px solid #ffffff24;border-radius:17px;padding:14px;margin:12px 0}.cards{display:flex;gap:9px;overflow-x:auto;padding:4px 0}.card{min-width:165px;max-width:165px;background:#ffffff13;border:1px solid #ffffff24;border-radius:14px;padding:12px}.card.selected{border-color:#ffcb5b}.caricon{font-size:42px;text-align:center}.small{font-size:12px;color:#c0ccd4}button.action{border:0;border-radius:11px;padding:12px 15px;background:#ffca57;color:#1b2430;font-weight:900;margin:5px 4px 5px 0}button.action:disabled{opacity:.4}button.secondary{background:#d9e6ee}#toast{position:fixed;top:70px;left:10%;width:80%;text-align:center;background:#111e2eea;border-radius:15px;padding:12px;display:none}#controls,#hud{display:none}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="leftHUD"></div><div id="rightHUD"></div></div><div id="controls"><div class="cluster"><button class="ctl" data-key="left">◀</button><button class="ctl" data-key="right">▶</button></div><div class="cluster"><button class="ctl" data-key="brake">▾</button><button class="ctl" data-key="gas">▲</button></div></div><div id="toast"></div><main id="menu"></main><script>
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d'),menu=document.getElementById('menu'),hud=document.getElementById('hud'),controls=document.getElementById('controls');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cvs.width=W*dpr;cvs.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const cars=[{name:'Falcon R1',cost:0,speed:180,grip:1.0,color:'#f3cb42'},{name:'Vortex GT',cost:1600,speed:205,grip:1.08,color:'#56c7e8'},{name:'Alpine RS',cost:3300,speed:225,grip:1.18,color:'#f46d72'},{name:'Thunder X',cost:5700,speed:245,grip:1.12,color:'#a68bff'},{name:'Phantom WRC',cost:9200,speed:270,grip:1.32,color:'#ecf3f6'}];
const tracks=[{name:'Waldprüfung',place:'Schwarzwald',length:2100,turn:0.75,road:'#a58b69',sky:'#284a39',unlock:0,prize:650},{name:'Alpenpass',place:'Schweiz',length:2600,turn:1.25,road:'#777e83',sky:'#4e6575',unlock:1,prize:950},{name:'Küstenjagd',place:'Italien',length:3100,turn:1.05,road:'#bd9871',sky:'#347d92',unlock:2,prize:1300},{name:'Mitternachtsrallye',place:'Norwegen',length:3500,turn:1.5,road:'#73849b',sky:'#17283e',unlock:3,prize:1800},{name:'Weltmeister-Finale',place:'Monte Carlo',length:4100,turn:1.8,road:'#a7a6a1',sky:'#445c6e',unlock:4,prize:3000}];
let save;try{save=JSON.parse(localStorage.getItem('rallySave'))}catch(e){}save=save||{money:300,car:0,owned:[0],unlocked:0,wins:[],upgrades:[0,0,0,0,0],best:{}};function persist(){try{localStorage.setItem('rallySave',JSON.stringify(save))}catch(e){}}let selectedTrack=0,selectedCar=save.car,running=false,keys={left:false,right:false,gas:false,brake:false},state,last=0;
function showMenu(message=''){running=false;hud.style.display='none';controls.style.display='none';menu.style.display='block';const trophy=save.wins.length;menu.innerHTML=`<h1>RALLY LEGENDS</h1><div class="sub">ROAD TO GLORY · KARRIERE-MODUS</div><div class="panel"><b>🏆 ${trophy}/5 Trophäen</b> &nbsp; 💰 ${save.money} Credits<br><p>${message||(['Dein Traum beginnt in einer alten Garage. Gewinne dein erstes Rennen und beweise, dass du zu den Besten gehörst.','Dein Talent spricht sich herum. Die Alpen warten auf dich!','Ein Rennteam bietet dir einen Vertrag an. Zeig ihnen, was du kannst!','Ein Rivale fordert dich zur Nachtrallye heraus.','Das Finale: Gewinne den Weltmeistertitel!','Du bist Rallye-Weltmeister! Du kannst alle Rennen erneut fahren.'][Math.min(save.unlocked,5)])}</p></div><h2>Rennen</h2><div class="cards">${tracks.map((t,i)=>`<div class="card ${selectedTrack===i?'selected':''}" onclick="chooseTrack(${i})"><b>${i+1}. ${t.name}</b><p class="small">${t.place} · ${(t.length/1000).toFixed(1)} km</p><div>${save.wins.includes(i)?'🏆 Gewonnen':i>save.unlocked?'🔒 Gesperrt':'🏁 Verfügbar'}</div><p class="small">Preisgeld: ${t.prize} Cr</p></div>`).join('')}</div><h2>Garage</h2><div class="cards">${cars.map((c,i)=>`<div class="card ${selectedCar===i?'selected':''}" onclick="chooseCar(${i})"><div class="caricon" style="color:${c.color}">🚘</div><b>${c.name}</b><p class="small">Tempo ${c.speed} · Grip ${Math.round(c.grip*100)}</p><div>${save.owned.includes(i)?'✓ Im Besitz':c.cost+' Cr'}</div></div>`).join('')}</div><div class="panel"><b>${cars[selectedCar].name}</b><p class="small">Motor-Upgrade Stufe ${save.upgrades[selectedCar]}/3</p><button class="action secondary" onclick="upgrade()" ${!save.owned.includes(selectedCar)||save.upgrades[selectedCar]>=3?'disabled':''}>Motor verbessern · ${600+save.upgrades[selectedCar]*550} Cr</button></div><button class="action" onclick="startOrBuy()">${save.owned.includes(selectedCar)?'🏁 RENNEN STARTEN':'AUTO KAUFEN · '+cars[selectedCar].cost+' Cr'}</button><p class="small">Steuerung: Links/rechts lenken, ▲ Gas, ▾ Bremse. Kollisionen beschädigen dein Auto. Bestzeiten werden gespeichert.</p>`;}
window.chooseTrack=i=>{selectedTrack=i;showMenu()};window.chooseCar=i=>{selectedCar=i;showMenu()};window.upgrade=()=>{let cost=600+save.upgrades[selectedCar]*550;if(save.money>=cost&&save.upgrades[selectedCar]<3){save.money-=cost;save.upgrades[selectedCar]++;persist();showMenu('Motor erfolgreich verbessert!')}else showMenu('Nicht genügend Credits.')};window.startOrBuy=()=>{if(!save.owned.includes(selectedCar)){if(save.money>=cars[selectedCar].cost){save.money-=cars[selectedCar].cost;save.owned.push(selectedCar);persist();showMenu('Neues Auto gekauft!')}else showMenu('Du brauchst mehr Credits. Gewinne weitere Rennen!');return}if(selectedTrack>save.unlocked){showMenu('Gewinne zuerst die vorherige Etappe.');return}startRace()};
function startRace(){save.car=selectedCar;persist();state={distance:0,speed:0,x:0,damage:0,time:0,ai:0,aiX:0.15,collisionCooldown:0,finished:false};menu.style.display='none';hud.style.display='flex';controls.style.display='flex';running=true;last=performance.now();requestAnimationFrame(frame)}
function curveAt(d){let t=tracks[selectedTrack];return Math.sin(d/190)*.32*t.turn+Math.sin(d/410+1)*.46*t.turn+Math.sin(d/87)*.11*t.turn}function roadOffset(d){return (Math.sin(d/280)*.33+Math.sin(d/570+1)*.42)*tracks[selectedTrack].turn}function polygon(points,fill){ctx.fillStyle=fill;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill()}
function draw(){let t=tracks[selectedTrack],horizon=H*.37;ctx.fillStyle=t.sky;ctx.fillRect(0,0,W,H);ctx.fillStyle=selectedTrack===3?'#30465c':'#7b978f';polygon([[0,horizon],[W*.14,horizon-75],[W*.27,horizon-15],[W*.47,horizon-120],[W*.65,horizon-25],[W*.84,horizon-100],[W,horizon-12],[W,horizon]],ctx.fillStyle);ctx.fillStyle=selectedTrack===2?'#668e76':'#44694e';ctx.fillRect(0,horizon,W,H-horizon);let n=48;for(let i=0;i<n;i++){let p=i/n,q=(i+1)/n;let depth=1-p,depth2=1-q;let y=horizon+Math.pow(p,1.65)*(H-horizon),y2=horizon+Math.pow(q,1.65)*(H-horizon);let dd=state.distance+depth*650,dd2=state.distance+depth2*650;let center=W/2+(roadOffset(dd)-roadOffset(state.distance))*W*.7-state.x*W*.22,center2=W/2+(roadOffset(dd2)-roadOffset(state.distance))*W*.7-state.x*W*.22;let half= W*(.035+p*.49),half2=W*(.035+q*.49);polygon([[center-half-8,y],[center+half+8,y],[center2+half2+8,y2],[center2-half2-8,y2]],i%2?'#bcb9a6':'#dfd6ba');polygon([[center-half,y],[center+half,y],[center2+half2,y2],[center2-half2,y2]],t.road);if(Math.floor(dd/45)%2===0)polygon([[center-2*p,y],[center+2*p,y],[center2+3*q,y2],[center2-3*q,y2]],'#f5ead2');if(i%4===0){let size=2+p*15;ctx.fillStyle=selectedTrack===3?'#d7e4e8':'#234c36';ctx.beginPath();ctx.arc(center-half-size*2,y-size*.5,size,0,7);ctx.fill();ctx.beginPath();ctx.arc(center+half+size*2,y-size*.5,size,0,7);ctx.fill()}}
// rival car in perspective
let gap=state.ai-state.distance;if(gap>0&&gap<580){let p=Math.max(.03,1-gap/580),y=horizon+Math.pow(p,1.65)*(H-horizon),cx=W/2+(roadOffset(state.ai)-roadOffset(state.distance))*W*.7-state.x*W*.22+state.aiX*W*.16*p;let s=12+p*45;polygon([[cx-s*.7,y-s*.6],[cx+s*.7,y-s*.6],[cx+s,y+s*.5],[cx-s,y+s*.5]],'#d74c42');ctx.fillStyle='#a5d9e5';ctx.fillRect(cx-s*.5,y-s*.4,s,s*.35)}
let cx=W/2,cy=H*.78,sz=Math.min(W*.24,92);ctx.save();ctx.translate(cx,cy);ctx.rotate(-state.x*.045);ctx.fillStyle='#12171c';ctx.fillRect(-sz*.9,sz*.17,sz*.35,sz*.7);ctx.fillRect(sz*.55,sz*.17,sz*.35,sz*.7);polygon([[-sz*.67,-sz*.5],[sz*.67,-sz*.5],[sz*.85,sz*.7],[-sz*.85,sz*.7]],cars[selectedCar].color);polygon([[-sz*.48,-sz*.38],[sz*.48,-sz*.38],[sz*.55,sz*.06],[-sz*.55,sz*.06]],'#253c50');ctx.fillStyle='#ef4343';ctx.fillRect(-sz*.7,sz*.5,sz*.3,sz*.14);ctx.fillRect(sz*.4,sz*.5,sz*.3,sz*.14);ctx.restore();document.getElementById('leftHUD').innerHTML=`${t.name}<br>${Math.round(state.distance)} / ${t.length} m<br>Schaden ${Math.round(state.damage)}%`;document.getElementById('rightHUD').innerHTML=`${Math.round(state.speed)} km/h<br>${state.time.toFixed(1)} s<br>Rivale ${Math.max(0,Math.round(state.ai-state.distance))} m`}
function frame(now){if(!running)return;let dt=Math.min((now-last)/1000,.04);last=now;let s=state,c=cars[selectedCar],t=tracks[selectedTrack];s.time+=dt;let max=c.speed+save.upgrades[selectedCar]*13;let target=keys.gas?max:0;if(keys.brake)target=0;s.speed+=((keys.gas?62:-35)-(keys.brake?140:0)-s.speed*.055)*dt;s.speed=Math.max(0,Math.min(max,s.speed));let steer=(keys.right?1:0)-(keys.left?1:0);s.x+=steer*dt*(.9+s.speed/150)*c.grip;s.x-=curveAt(s.distance)*dt*s.speed/120;s.x=Math.max(-3,Math.min(3,s.x));if(Math.abs(s.x)>1.35){s.speed=Math.max(30,s.speed-110*dt);s.damage=Math.min(100,s.damage+7*dt)}s.distance+=s.speed/3.6*dt*(1-s.damage*.003);s.ai+=dt*(selectedTrack===0?28:35+selectedTrack*3);s.aiX=Math.sin(s.ai/240)*.45;s.collisionCooldown-=dt;if(Math.abs(s.ai-s.distance)<13&&Math.abs(s.x-s.aiX)<.55&&s.collisionCooldown<=0){s.damage=Math.min(100,s.damage+18);s.speed*=.45;s.collisionCooldown=2}draw();if(s.distance>=t.length||s.damage>=100){finish(s.distance>=t.length);return}requestAnimationFrame(frame)}
function finish(completed){running=false;let won=completed&&state.distance>state.ai,prize=completed?(won?tracks[selectedTrack].prize:Math.round(tracks[selectedTrack].prize*.3)):0;save.money+=prize;if(won&&!save.wins.includes(selectedTrack))save.wins.push(selectedTrack);if(won&&selectedTrack===save.unlocked)save.unlocked=Math.min(5,save.unlocked+1);if(completed)save.best[selectedTrack]=Math.min(save.best[selectedTrack]||Infinity,state.time);persist();showMenu(`${!completed?'Dein Wagen ist ausgefallen!':won?'🏆 SIEG! '+(selectedTrack===4?'Du bist Rallye-Weltmeister!':'Du hast die Etappe gewonnen!'):'Ziel erreicht, aber dein Rivale war schneller.'} Fahrzeit: ${state.time.toFixed(1)} s. Preisgeld: ${prize} Credits. ${won?'Neue Herausforderungen warten auf dich.':'Verbessere dein Auto und versuche es erneut.'}`)}
for(let b of document.querySelectorAll('.ctl')){let key=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[key]=false)}addEventListener('keydown',e=>{let m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',a:'left',d:'right',w:'gas',s:'brake'};if(m[e.key]){keys[m[e.key]]=true;e.preventDefault()}});addEventListener('keyup',e=>{let m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',a:'left',d:'right',w:'gas',s:'brake'};if(m[e.key])keys[m[e.key]]=false});showMenu();
</script></body></html>
