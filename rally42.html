<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Rally Legends 4.2 • Surface & Handling</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101c2a;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;padding:16px;pointer-events:none;text-shadow:0 2px 6px #000}#hud strong{font-size:26px}#controls{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}#controls section{display:flex;gap:8px}button{border:2px solid #ffffff55;border-radius:18px;background:#152838bb;color:white;font-weight:800;font-size:18px;min-width:65px;height:76px;touch-action:none;user-select:none;-webkit-user-select:none}button:active,.down{background:#e6b857;color:#152838}#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1722df;z-index:4;padding:20px}#panel{max-width:410px;text-align:center;background:#172a39;border:1px solid #476070;border-radius:22px;padding:25px}#panel button{background:#e9bb58;color:#142536;width:100%;margin-top:14px}#notice{position:fixed;top:38%;width:100%;text-align:center;color:white;font-size:16px;text-shadow:0 2px 5px black;pointer-events:none}#error{color:#ffca93;font-size:13px;white-space:pre-wrap}</style></head><body><div id="hud"><div><small>RALLY LEGENDS 4.2 • 3D</small><br><strong id="speed">0 km/h</strong><br><span id="distance">0 m</span></div><div style="text-align:right"><small>ALPENSPRINT</small><br><strong id="timer">00:00</strong><br><span id="surface">SCHOTTER</span></div></div><div id="notice"></div><div id="controls"><section><button data-key="left">◀</button><button data-key="right">▶</button></section><section><button data-key="brake">BREMSE</button><button data-key="drift">DRIFT</button><button data-key="gas" style="background:#b58a36">GAS</button></section></div><div id="start"><div id="panel"><h1>RALLY LEGENDS 4.2</h1><p>HANDLING & WORLD UPDATE • Alpine Sprint</p><p>Sanftere Beschleunigung, kontrollierbare Bremse, fairer Gras-Untergrund und Landschaft bis zum Ziel. Querformat empfohlen.</p><p id="loading">Lade 3D-Engine …</p><div id="error"></div><button id="play" disabled>SPIEL STARTEN</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id);const scene=new THREE.Scene();scene.background=new THREE.Color(0x91b9ce);scene.fog=new THREE.FogExp2(0x91b9ce,.0022);const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,1100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9efff,0x657451,2.1));const sun=new THREE.DirectionalLight(0xfff0ce,2.3);sun.position.set(-80,150,110);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-120;sun.shadow.camera.right=120;sun.shadow.camera.top=120;sun.shadow.camera.bottom=-120;scene.add(sun);
const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const grass=mat(0x527b48),roadMat=mat(0x827365),edgeMat=mat(0xe2d3b2),trunk=mat(0x604634),leaf=mat(0x2f6647),leaf2=mat(0x3f8053),rock=mat(0x88918b),yellow=mat(0xf3bc36,.55),dark=mat(0x1a2731),glass=mat(0x557f99,.25),red=mat(0xd73e31),white=mat(0xe8e9dc);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(16000,16000),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function roadX(z){return 24*Math.sin(z/115)+12*Math.sin(z/49)}function roadDx(z){return 24/115*Math.cos(z/115)+12/49*Math.cos(z/49)}
const len=4400,step=8,half=8.5;const verts=[],uv=[],indices=[];for(let i=0;i<=len/step;i++){let z=-i*step,x=roadX(z);for(const offset of [-half,half]){verts.push(x+offset,.09,z);uv.push(offset, i*step/12)}if(i){let a=(i-1)*2,b=i*2;indices.push(a,a+1,b,a+1,b+1,b)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(indices);geo.computeVertexNormals();let road=new THREE.Mesh(geo,roadMat);road.receiveShadow=true;scene.add(road);
// Curved gravel shoulders and alternating roadside markers
const shoulderGeo=new THREE.BufferGeometry(), shoulderVerts=[], shoulderIdx=[];
for(let i=0;i<=len/step;i++){const z=-i*step,x=roadX(z);for(let side of [-1,1])for(let w of [half,half+1.7])shoulderVerts.push(x+side*w,.075,z);if(i){for(let side=0;side<2;side++){let a=(i-1)*4+side*2,b=i*4+side*2;shoulderIdx.push(a,a+1,b,a+1,b+1,b)}}}
shoulderGeo.setAttribute('position',new THREE.Float32BufferAttribute(shoulderVerts,3));shoulderGeo.setIndex(shoulderIdx);shoulderGeo.computeVertexNormals();const shoulders=new THREE.Mesh(shoulderGeo,mat(0xb6a28b));shoulders.receiveShadow=true;scene.add(shoulders);
const stripeGeo=new THREE.BoxGeometry(.23,.03,3.5);for(let z=-18;z>-(len+100);z-=16){let x=roadX(z);let s=new THREE.Mesh(stripeGeo,edgeMat);s.position.set(x,.12,z);s.rotation.y=-Math.atan(roadDx(z));scene.add(s)}
function tree(x,z,s){const g=new THREE.Group();let t=new THREE.Mesh(new THREE.CylinderGeometry(.19*s,.3*s,2.1*s,6),trunk);t.position.y=1*s;g.add(t);for(let j=0;j<3;j++){let crown=new THREE.Mesh(new THREE.ConeGeometry((2.15-j*.4)*s,3.4*s,7),j%2?leaf2:leaf);crown.position.y=(2.6+j*1.15)*s;crown.castShadow=true;g.add(crown)}g.position.set(x,0,z);scene.add(g)}function boulder(x,z,s){let m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),rock);m.position.set(x,s*.35,z);m.scale.y=.65;m.castShadow=true;scene.add(m)}let seed=3819;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let z=-15;z>-(len+220);z-=11){for(let side of [-1,1]){let x=roadX(z)+side*(14+rnd()*62);if(rnd()<.86)tree(x,z+(rnd()-.5)*10,.65+rnd()*.8);if(rnd()<.18)boulder(x+side*5,z,1+rnd()*2)}}
// Mountains on the distant horizon; lightweight low-poly geometry
const mountainMats=[mat(0x78928d),mat(0x8fa39b),mat(0x637f7b)];
for(let i=0;i<34;i++){let z=-200-i*140, side=i%2?-1:1, x=roadX(z)+side*(140+(i%5)*65);let mountain=new THREE.Mesh(new THREE.ConeGeometry(65+(i%4)*22,105+(i%5)*30,5),mountainMats[i%3]);mountain.position.set(x,35,z);mountain.rotation.y=i*.7;scene.add(mountain)}
const car=new THREE.Group();scene.add(car);function part(geometry,material,x,y,z){let m=new THREE.Mesh(geometry,material);m.position.set(x,y,z);m.castShadow=true;car.add(m);return m}part(new THREE.BoxGeometry(2.5,.65,4.65),yellow,0,1.05,0);part(new THREE.BoxGeometry(2.13,.7,2.45),yellow,0,1.72,.1);part(new THREE.BoxGeometry(2.16,.47,.09),glass,0,1.7,-1.13);part(new THREE.BoxGeometry(2.16,.45,.09),glass,0,1.7,1.31);for(let side of [-1,1]){part(new THREE.BoxGeometry(.1,.42,1.45),glass,side*1.08,1.71,.1);for(let z of [-1.45,1.45]){let w=part(new THREE.CylinderGeometry(.53,.53,.37,16),dark,side*1.35,.56,z);w.rotation.z=Math.PI/2}part(new THREE.BoxGeometry(.57,.19,.12),red,side*.85,1.12,2.34);part(new THREE.BoxGeometry(.55,.14,.12),white,side*.84,1.13,-2.34)}part(new THREE.BoxGeometry(2.5,.11,.7),dark,0,2.13,1.83);part(new THREE.BoxGeometry(2.6,.22,.22),dark,0,.75,2.4);
// Hood and roof accents, rear license plate and tail lights
part(new THREE.BoxGeometry(1.45,.035,.35),dark,0,1.4,-1.9);
part(new THREE.BoxGeometry(1.05,.045,.32),white,0,2.09,-.2);
part(new THREE.BoxGeometry(.65,.14,.06),white,0,.99,2.39);
part(new THREE.BoxGeometry(2.05,.10,.24),dark,0,.68,-2.34);
for(let side of [-1,1]){part(new THREE.BoxGeometry(.42,.14,.08),white,side*.85,1.09,-2.37);part(new THREE.BoxGeometry(.42,.12,.08),red,side*.88,1.08,2.37)}
// Reusable transparent dust sprites (no external texture)
const dustCanvas=document.createElement('canvas');dustCanvas.width=dustCanvas.height=64;const dc=dustCanvas.getContext('2d'),grad=dc.createRadialGradient(32,32,2,32,32,32);grad.addColorStop(0,'rgba(220,204,178,.62)');grad.addColorStop(.45,'rgba(209,192,164,.24)');grad.addColorStop(1,'rgba(209,192,164,0)');dc.fillStyle=grad;dc.fillRect(0,0,64,64);const dustTex=new THREE.CanvasTexture(dustCanvas);
const dust=[];for(let i=0;i<34;i++){let sp=new THREE.Sprite(new THREE.SpriteMaterial({map:dustTex,transparent:true,depthWrite:false,opacity:0}));sp.visible=false;scene.add(sp);dust.push({sp,life:0,max:1})}let dustCursor=0;
function puff(x,z,amount){let d=dust[dustCursor++%dust.length];d.life=d.max=.45+Math.random()*.4;d.sp.position.set(x,.4,z);d.sp.scale.setScalar(.8+amount*1.3);d.sp.material.opacity=.45;d.sp.visible=true}

const keys={left:false,right:false,gas:false,brake:false,drift:false};document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const set=v=>{keys[k]=v;b.classList.toggle('down',v)};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>set(false))});const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',' ':'drift'};window.addEventListener('keydown',e=>{if(map[e.key]){e.preventDefault();keys[map[e.key]]=true}});window.addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=false});
let running=false,speed=0,heading=Math.PI,px=roadX(0),pz=0,elapsed=0,dist=0,last=performance.now();
let vx=0,vz=0,steerSmooth=0,yawVelocity=0,driftAmount=0,camHeading=Math.PI,shake=0,dustTime=0;
car.position.set(px,.12,pz);$('loading').textContent='3D-Engine bereit';$('play').disabled=false;
$('play').onclick=()=>{$('start').style.display='none';running=true;last=performance.now()};
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;
if(running){
 elapsed+=dt;
 const roadOffset=Math.abs(px-roadX(pz));const off=roadOffset>half-1;
 const forwardX=Math.sin(heading),forwardZ=Math.cos(heading);
 const rightX=Math.cos(heading),rightZ=-Math.sin(heading);
 let forwardSpeed=vx*forwardX+vz*forwardZ;
 let lateralSpeed=vx*rightX+vz*rightZ;
 const throttle=keys.gas?1:0,braking=keys.brake?1:0;
 const steerInput=Number(keys.left)-Number(keys.right);
 steerSmooth+=(steerInput-steerSmooth)*Math.min(1,dt*7.2);
 const speedFactor=Math.min(1,Math.abs(forwardSpeed)/18);
 const desiredDrift=(keys.drift&&Math.abs(forwardSpeed)>7)?1:0;
 driftAmount+=(desiredDrift-driftAmount)*Math.min(1,dt*(desiredDrift?4.8:2.6));
 const steerRate=(.39+speedFactor*.79)*(1+driftAmount*.6);
 const desiredYaw=steerSmooth*steerRate*Math.min(1,Math.abs(forwardSpeed)/8)*(forwardSpeed<0?-1:1);
 yawVelocity+=(desiredYaw-yawVelocity)*Math.min(1,dt*(driftAmount?2.8:6));
 heading+=yawVelocity*dt;
 const grip=(off?2.35:3.9)*(1-driftAmount*.76);
 lateralSpeed*=Math.exp(-grip*dt);
 lateralSpeed+=steerSmooth*driftAmount*Math.abs(forwardSpeed)*.26*dt;
 // Progressive acceleration: 0–100 km/h takes roughly 8–10 seconds on gravel.
 // Grass reduces traction and adds rolling resistance, but does not behave like a wall.
 const absSpeed=Math.abs(forwardSpeed);
 const enginePower=(off?0.76:1)*(8.1*Math.max(.28,1-absSpeed/61));
 const rolling=off?1.25:.58;
 const airDrag=.0026*forwardSpeed*absSpeed;
 const coastResistance=rolling*Math.sign(forwardSpeed);
 let acceleration=throttle*enginePower-airDrag-coastResistance;
 // Brake is stronger than coasting, with no abrupt reversal into reverse gear.
 if(braking){const decel=off?9.8:12.8;acceleration-=Math.sign(forwardSpeed||1)*decel;}
 const previousForward=forwardSpeed;
 forwardSpeed+=acceleration*dt;
 if(!throttle && !braking && previousForward*forwardSpeed<0)forwardSpeed=0;
 if(braking && previousForward*forwardSpeed<0)forwardSpeed=0;
 forwardSpeed=Math.max(-4,Math.min(off?39:49,forwardSpeed));
 vx=forwardX*forwardSpeed+rightX*lateralSpeed;
 vz=forwardZ*forwardSpeed+rightZ*lateralSpeed;
 px+=vx*dt;pz+=vz*dt;
 speed=Math.hypot(vx,vz);dist=Math.max(dist,-pz);
 // No extra velocity multiplier off-road: the surface model above handles slowing.
 car.position.set(px,.17+Math.sin(now*.014)*Math.min(.045,speed*.001),pz);
 car.rotation.y=heading-Math.PI;
 car.rotation.z+=((-steerSmooth*.055-lateralSpeed*.012)-car.rotation.z)*Math.min(1,dt*6);
 car.rotation.x+=(Math.max(-.08,Math.min(.08,acceleration*.004))-car.rotation.x)*Math.min(1,dt*5);
 dustTime-=dt;
 if(dustTime<=0&&speed>7&&(driftAmount>.2||off||Math.abs(lateralSpeed)>2)){
  const intensity=Math.min(1,driftAmount*.8+Math.abs(lateralSpeed)*.08+(off?.35:0));
  puff(px-forwardX*2.1+rightX*1.05,pz-forwardZ*2.1+rightZ*1.05,intensity);
  puff(px-forwardX*2.1-rightX*1.05,pz-forwardZ*2.1-rightZ*1.05,intensity);
  dustTime=.055;
 }
 $('speed').textContent=Math.round(Math.abs(forwardSpeed)*3.6)+' km/h';
 $('distance').textContent=Math.floor(dist)+' / '+len+' m';
 $('timer').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');
 $('surface').textContent=off?'GRAS • SANFTER WIDERSTAND':driftAmount>.25?'DRIFT • '+Math.round(Math.abs(lateralSpeed)*3.6)+' km/h':'SCHOTTER';
 if(dist>=len-20){running=false;$('start').style.display='flex';$('panel').querySelector('h1').textContent='ZIEL ERREICHT!';$('loading').textContent='Zeit: '+$('timer').textContent;$('play').textContent='NOCHMAL FAHREN';$('play').onclick=()=>location.reload()}
}
for(let d of dust){if(d.life>0){d.life-=dt;d.sp.position.y+=dt*1.7;d.sp.scale.multiplyScalar(1+dt*1.7);d.sp.material.opacity=Math.max(0,d.life/d.max)*.43;if(d.life<=0)d.sp.visible=false}}
const desiredCamHeading=heading-Math.max(-.25,Math.min(.25,(vx*Math.cos(heading)-vz*Math.sin(heading))*.016));
camHeading+=Math.atan2(Math.sin(desiredCamHeading-camHeading),Math.cos(desiredCamHeading-camHeading))*Math.min(1,dt*2.4);
const behind=new THREE.Vector3(-Math.sin(camHeading)*11,5.2+Math.min(1,speed/60),-Math.cos(camHeading)*11);
const desired=car.position.clone().add(behind);
camera.position.lerp(desired,Math.min(1,dt*3.3));
const target=car.position.clone().add(new THREE.Vector3(Math.sin(camHeading)*12,1.65,Math.cos(camHeading)*12));
camera.lookAt(target);
camera.fov+=( (67+Math.min(9,speed*.17))-camera.fov)*Math.min(1,dt*2.4);camera.updateProjectionMatrix();
sun.position.set(px-80,150,pz+110);sun.target.position.set(px,0,pz);sun.target.updateMatrixWorld();
renderer.render(scene,camera)
}
requestAnimationFrame(animate);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script><script>window.addEventListener('error',e=>{document.getElementById('loading').textContent='Ladefehler';document.getElementById('error').textContent=e.message+' — Bitte Internetverbindung prüfen und in Safari öffnen.'})</script></body></html>
